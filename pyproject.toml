[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-skilljar"
dynamic = ["version"]
description = "Python client and local MCP server for both Skilljar REST APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cloud Security Alliance" }]
maintainers = [{ name = "Kurt Seifried", email = "kseifried@cloudsecurityalliance.org" }]
keywords = ["skilljar", "lms", "training", "mcp", "elearning", "gainsight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Typing :: Typed",
]
# `mcp` is REQUIRED, not an extra. The package installs a console script
# (csa-skilljar-mcp) unconditionally, so that script must work unconditionally -
# `pipx install csa-skilljar` previously put a command on PATH that crashed with
# ModuleNotFoundError. A broken command on PATH is a worse failure than one extra
# dependency for a library-only embedder.
dependencies = ["httpx>=0.27", "typing_extensions>=4.7", "mcp>=2.1"]

[project.optional-dependencies]
# Kept as a no-op alias so `csa-skilljar[mcp]` keeps working for anyone who
# copied it from an early README. mcp itself is now a required dependency.
mcp = []
# bandit and pip-audit are here so `scripts/verify.sh` can run the same security
# gate CI does. A local gate weaker than the remote one teaches you to trust it.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11",
       "respx>=0.21", "anyio>=4", "build>=1.2",
       "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
csa-skilljar-mcp = "csa_skilljar.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/CloudSecurityAlliance/csa-skilljar"
Issues = "https://github.com/CloudSecurityAlliance/csa-skilljar/issues"

[tool.setuptools.dynamic]
version = { attr = "csa_skilljar.__version__" }

[tool.setuptools.package-data]
csa_skilljar = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702"]   # one-line `a = ...; b = ...` is house style here, not a defect

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["anyio: async tests"]

[tool.coverage.run]
# BOTH of these were missing, and each made the number mean something other than it said.
#
# `source` — CI runs a bare `pytest --cov`, which with no source set measures every module
# imported, TESTS INCLUDED. The suite is ~4,400 statements of test code that executes itself
# by definition, so it diluted the figure upward: 94% reported against 92% of the library.
# The gate was partly being met by tests covering themselves.
#
# `branch` — off, so `if x: ...` counted as covered once either arm ran. The sibling servers
# all measure branches, and 100% has to mean the same thing across the fleet or comparing
# them is meaningless. Turning it on cost two points and found real gaps.
source = ["csa_skilljar"]
branch = true

[tool.coverage.report]
# Matches the rest of the fleet. Without these, `if TYPE_CHECKING:` blocks and
# `raise NotImplementedError` stubs were counted as unexecuted code - they are
# declarations, and a coverage number that includes them measures the shape of
# the source rather than what the tests reached.
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
# A `Protocol` stub body is `...` with nothing to execute, but branch coverage
# records one as a partial branch. `backend.py` declares 81 of them, so they were
# 81 phantom misses no test could ever remove. Excluding them hides no untested
# code; it stops the number counting declarations as code.
exclude_also = [":\\s*\\.\\.\\.\\s*$"]
# The MEASURED number, under the corrected settings above. TESTING.md: "a gate below the
# measured number cannot fail". The standard is 100 and this is a ratchet toward it: raising
# it means covering code, never lowering it to fit.
# 100, and it has to be 100 rather than 99. A gate set below the measured number cannot
# fail: at 93 with the suite at 100, seven points of regression are invisible, and the
# number stops being a gate and becomes a decoration. The exceptions are `# pragma: no
# cover` at the line, each carrying its reason - there are two, and both name a premise
# that a test pins, so an unreachable branch that becomes reachable fails loudly rather
# than silently widening the exemption.
fail_under = 100
