[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-skilljar"
dynamic = ["version"]
description = "Python client and local MCP server for both Skilljar REST APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cloud Security Alliance" }]
maintainers = [{ name = "Kurt Seifried", email = "kseifried@cloudsecurityalliance.org" }]
keywords = ["skilljar", "lms", "training", "mcp", "elearning", "gainsight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Typing :: Typed",
]
# `mcp` is REQUIRED, not an extra. The package installs a console script
# (csa-skilljar-mcp) unconditionally, so that script must work unconditionally -
# `pipx install csa-skilljar` previously put a command on PATH that crashed with
# ModuleNotFoundError. A broken command on PATH is a worse failure than one extra
# dependency for a library-only embedder.
dependencies = ["httpx>=0.27", "typing_extensions>=4.7", "mcp>=2.1"]

[project.optional-dependencies]
# Kept as a no-op alias so `csa-skilljar[mcp]` keeps working for anyone who
# copied it from an early README. mcp itself is now a required dependency.
mcp = []
# bandit and pip-audit are here so `scripts/verify.sh` can run the same security
# gate CI does. A local gate weaker than the remote one teaches you to trust it.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11",
       "respx>=0.21", "anyio>=4", "build>=1.2",
       "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
csa-skilljar-mcp = "csa_skilljar.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/CloudSecurityAlliance/csa-skilljar"
Issues = "https://github.com/CloudSecurityAlliance/csa-skilljar/issues"

[tool.setuptools.dynamic]
version = { attr = "csa_skilljar.__version__" }

[tool.setuptools.package-data]
csa_skilljar = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702"]   # one-line `a = ...; b = ...` is house style here, not a defect

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["anyio: async tests"]

[tool.coverage.report]
fail_under = 85
